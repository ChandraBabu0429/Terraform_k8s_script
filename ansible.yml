- name: Install Apache and Start Service
  hosts: localhost
  become: yes
  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Ensure Apache is running
      service:
        name: apache2
        state: started

    - name: Debug Apache Version
      command: apache2 -v
      register: apache_version

    - name: Show Apache Version
      debug:
        msg: "Apache Version: {{ apache_version.stdout }}"

