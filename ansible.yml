# ansible.yml
- name: Install curl and verify installation
  hosts: localhost
  become: yes
  tasks:
    - name: Install curl
      apt:
        name: curl
        state: present
        update_cache: yes

    - name: Check curl version
      command: curl --version
      register: curl_version

    - name: Show curl version
      debug:
        var: curl_version.stdout

  hosts: localhost
  become: yes
  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Ensure Apache is running
      service:
        name: apache2
        state: started

    - name: Debug Apache Version
      command: apache2 -v
      register: apache_version

    - name: Show Apache Version
      debug:
        msg: "Apache Version: {{ apache_version.stdout }}"

