name: Ansible CI/CD Pipeline

on:
  push:
    branches:
      - master    # Trigger on pushes to the master branch
  pull_request:
    branches:
      - master    # Trigger on pull requests to the master branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Ansible
      uses: shivammathur/setup-ansible@v1

    - name: Run Ansible playbook
      run: ansible-playbook ansible.yml
