name: Ansible Playbook CI/CD

on:
  push:
    branches:
      - main  # or master depending on your default branch
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use an appropriate runner for your case

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Ansible
      uses: shivammathur/setup-ansible@v2
      with:
        version: 'latest'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-apt

    - name: Run Ansible playbook
      run: |
        ansible-playbook ansible.yml -i localhost, --connection=local
